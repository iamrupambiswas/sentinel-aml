name: CI

# Every push and pull request: all Java tests (Testcontainers MySQL/Redis included: GitHub runners have Docker),
# the console's type check, unit tests and production build, and the console Docker image.
on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  services:
    name: Java services
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test every module
        working-directory: services
        # The four @SpringBootTest "contextLoads" tests need the docker-compose stack (MySQL, Redis, Artemis);
        # they are excluded here. Everything else runs, including the Testcontainers integration tests.
        run: >
          mvn -B -ntp verify
          -Dtest='!*ApplicationTests'
          -Dsurefire.failIfNoSpecifiedTests=false

  console:
    name: Console (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: Production build
        env:
          # Placeholders: the build only needs the variables to exist
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: ci-placeholder
          KEYCLOAK_ISSUER: http://localhost:8180/realms/sentinel
          KEYCLOAK_CLIENT_ID: sentinel-console
          KEYCLOAK_CLIENT_SECRET: ci-placeholder
        run: npm run build

  console-image:
    name: Console Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build (not pushed)
        run: docker build -t sentinel-console:ci frontend
