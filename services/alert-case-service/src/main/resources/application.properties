server.port=8085
spring.application.name=alert-case-service

# MySQL (alert_case_db)
# useAffectedRows=true: INSERT ... ON DUPLICATE KEY UPDATE returns 0 when the row already existed,
# which is how AlertIngestService tells "new alert" from "merged into existing alert" (P14).
spring.datasource.url=${ALERT_DB_URL:jdbc:mysql://localhost:3306/alert_case_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&useAffectedRows=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway owns the schema; Hibernate only validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# ActiveMQ Artemis (must match the other services)
spring.artemis.mode=native
spring.artemis.broker-url=${ARTEMIS_URL:tcp://localhost:61616}
spring.artemis.user=${ARTEMIS_USER:admin}
spring.artemis.password=${ARTEMIS_PASSWORD:adminpassword}
# Transacted session: an exception rolls the message back -> broker redelivers -> DLQ after max attempts (P21)
spring.jms.listener.session.transacted=true

# Alerts
sentinel.alerts.concurrency=4-8

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

management.endpoints.web.exposure.include=health,info,metrics
