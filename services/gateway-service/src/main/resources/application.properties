spring.application.name=gateway-service
# Single entry point for the platform (Keycloak was moved to 8180 in docker-compose to free this port)
server.port=8080

# --- Routes (Spring Cloud Gateway Server MVC, 2023.0.x property style) ---
spring.cloud.gateway.mvc.routes[0].id=customer-service
spring.cloud.gateway.mvc.routes[0].uri=${CUSTOMER_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/v1/customers,/api/v1/customers/**,/api/v1/accounts/**,/api/v1/admin/**

spring.cloud.gateway.mvc.routes[1].id=ingestion-service
spring.cloud.gateway.mvc.routes[1].uri=${INGESTION_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/v1/transactions/**,/api/v1/ingestion/**

spring.cloud.gateway.mvc.routes[2].id=detection-service
spring.cloud.gateway.mvc.routes[2].uri=${DETECTION_SERVICE_URL:http://localhost:8084}
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/v1/rules,/api/v1/rules/**,/api/v1/detection/**,/api/v1/ops/**

spring.cloud.gateway.mvc.routes[3].id=alert-case-service
spring.cloud.gateway.mvc.routes[3].uri=${ALERT_CASE_SERVICE_URL:http://localhost:8085}
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/api/v1/alerts,/api/v1/alerts/**,/api/v1/cases/**,/api/v1/audit/**

management.endpoints.web.exposure.include=health,info,gateway

# Phase 6: Keycloak JWTs (sentinel realm). Must match the iss claim, i.e. the URL tokens are requested from.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/sentinel}

# Phase 7: rate limiting (Redis token bucket per caller: JWT subject, or client IP when anonymous)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Burst of 100 requests, then 20 per second sustained
sentinel.rate-limit.capacity=${RATE_LIMIT_CAPACITY:100}
sentinel.rate-limit.refill-per-second=${RATE_LIMIT_REFILL_PER_SECOND:20}

# Phase 7: request body limits (413 before the request reaches a service). CSV batch uploads get more.
sentinel.request-limits.max-body=${MAX_BODY:1MB}
sentinel.request-limits.max-upload=${MAX_UPLOAD:50MB}
sentinel.request-limits.upload-paths=/api/v1/ingestion/batches
