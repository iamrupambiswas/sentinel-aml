# Server and App
server.port=8083
spring.application.name=ingestion-service

# Database Configuration (ingestion_db)
spring.datasource.url=jdbc:mysql://localhost:3306/ingestion_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&rewriteBatchedStatements=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
# JDBC batching: together with persist() + rewriteBatchedStatements this is what makes 10k rows < 2 min
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Redis Configuration (Default Docker Compose port)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ActiveMQ Artemis
spring.artemis.mode=native
spring.artemis.broker-url=tcp://localhost:61616
spring.artemis.user=admin
spring.artemis.password=adminpassword
spring.jms.pub-sub-domain=false

# Spring Batch Configuration
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# File Upload Limits (For massive CSV files)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# FX rates cached in Redis (P18) - refreshed hourly
spring.cache.type=redis
spring.cache.redis.time-to-live=1h

# Outbox relay
sentinel.outbox.poll-interval-ms=200
sentinel.outbox.page-size=500
sentinel.batch.chunk-size=500

management.endpoints.web.exposure.include=health,info,metrics

# Phase 6: Keycloak JWTs (sentinel realm). Must match the iss claim, i.e. the URL tokens are requested from.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/sentinel}
