# Server and App
server.port=8083
spring.application.name=ingestion-service

# Database Configuration (ingestion_db)
spring.datasource.url=jdbc:mysql://localhost:3306/ingestion_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Redis Configuration (Default Docker Compose port)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ActiveMQ Artemis
spring.artemis.mode=native
spring.artemis.broker-url=tcp://localhost:61616
spring.artemis.user=admin
spring.artemis.password=adminpassword
spring.jms.listener.session.transacted=true
spring.jms.pub-sub-domain=false

# Spring Batch Configuration
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false

# File Upload Limits (For massive CSV files)
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB