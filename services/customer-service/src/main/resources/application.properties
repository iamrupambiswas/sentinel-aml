# Server & Application Name
server.port=8082
spring.application.name=customer-service

# MySQL Database Connection (connects to your Docker container)
#spring.datasource.url=jdbc:mysql://localhost:3306/customer_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.url=jdbc:mysql://localhost:3306/customer_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate (Flyway manages the schema, Hibernate just validates)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Secret key for encrypting PII (ID numbers) - 32 bytes / 256 bits Base64 encoded
sentinel.encryption.key=U2VudGluZWxBbWxEZXZlbG9wbWVudEtleTEyMzQ1Njc=