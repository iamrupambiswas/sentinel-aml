# Server & Application Name
server.port=8082
spring.application.name=customer-service

# MySQL Database Connection (connects to your Docker container)
#spring.datasource.url=jdbc:mysql://localhost:3306/customer_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.url=jdbc:mysql://localhost:3306/customer_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate (Flyway manages the schema, Hibernate just validates)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Secret key for encrypting PII (ID numbers) - 32 bytes / 256 bits Base64 encoded
# Comes from the environment in every non-local environment (blueprint: no secrets in Git).
# The fallback is a DEV-ONLY key.
sentinel.encryption.key=${SENTINEL_ENCRYPTION_KEY:U2VudGluZWxBbWxEZXZlbG9wbWVudEtleTEyMzQ1Njc=}

# Redis (Phase 5): customer-service owns aml:acct-risk:{accountId}, read by detection-service
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Full resync of every account's effective risk rating when the service starts
sentinel.risk.sync-on-startup=true

# Phase 6: Keycloak JWTs (sentinel realm). Must match the iss claim, i.e. the URL tokens are requested from.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/sentinel}
