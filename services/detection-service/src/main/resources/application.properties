server.port=8084
spring.application.name=detection-service

# ActiveMQ Artemis (must match ingestion-service)
spring.artemis.mode=native
spring.artemis.broker-url=${ARTEMIS_URL:tcp://localhost:61616}
spring.artemis.user=${ARTEMIS_USER:admin}
spring.artemis.password=${ARTEMIS_PASSWORD:adminpassword}
# Transacted listener session: an exception rolls the message back for redelivery (then DLQ after max attempts)
spring.jms.listener.session.transacted=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# MySQL
spring.datasource.url=${DETECTION_DB_URL:jdbc:mysql://localhost:3306/sentinel_detection?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway owns the schema; Hibernate only validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Detection
sentinel.detection.concurrency=4-8
# Accounts with these prefixes belong to other banks: they are not monitored as "our" accounts
sentinel.detection.external-account-prefixes=EXT-
sentinel.rules.refresh-ms=300000
sentinel.watchlist.refresh-ms=300000
sentinel.baseline.cron=0 30 0 * * *

management.endpoints.web.exposure.include=health,info,metrics
