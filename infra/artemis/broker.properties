# ActiveMQ Artemis broker properties (P21: poison messages and dead letters).
# Mounted into the container at /var/lib/artemis-instance/etc/broker.properties (see docker-compose.yml);
# Artemis applies it on top of broker.xml at startup.
#
# Without this, Artemis' default is: redeliver immediately, forever. One message that always fails
# (bad JSON, a bug) would spin a consumer thread at 100% and flood the logs.
#
# For every sentinel.* address (the two queues and the rules topic):
#   - try at most 5 times
#   - wait 1 s, 2 s, 4 s, 8 s between attempts (capped at 30 s) so short outages heal themselves
#   - then move the message to DLQ.<queue name> (one dead-letter queue per source queue, auto-created)
addressSettings."sentinel.#".maxDeliveryAttempts=5
addressSettings."sentinel.#".redeliveryDelay=1000
addressSettings."sentinel.#".redeliveryMultiplier=2.0
addressSettings."sentinel.#".maxRedeliveryDelay=30000
addressSettings."sentinel.#".deadLetterAddress=DLQ
addressSettings."sentinel.#".autoCreateDeadLetterResources=true
addressSettings."sentinel.#".deadLetterQueuePrefix=DLQ.
